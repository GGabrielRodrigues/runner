name: Build - Sistema Runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # T-05.1.2: Job de Testes Multiplataforma
  test:
    name: Testar em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Go Vet (Análise Estática)
        working-directory: projetos/go
        run: go vet ./...

      - name: Executar Testes de Aceitação
        # Isso vai rodar o version_test.go em cada OS
        working-directory: projetos/go
        run: go test ./cmd/assinatura/... -v

  # T-05.1.3: Job de Cross-Compilation
  build:
    name: Cross-Compilation
    needs: test # Só roda se os testes passarem (T-05.1.3)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compilar para Linux (amd64)
        working-directory: projetos/go
        run: |
          mkdir -p ../../dist
          GOOS=linux GOARCH=amd64 go build -o ../../dist/assinatura-linux-amd64 ./cmd/assinatura

      - name: Compilar para Windows (amd64)
        # Nota: Windows precisa do .exe
        working-directory: projetos/go
        run: GOOS=windows GOARCH=amd64 go build -o ../../dist/assinatura-windows-amd64.exe ./cmd/assinatura

      - name: Compilar para macOS (amd64)
        working-directory: projetos/go
        run: GOOS=darwin GOARCH=amd64 go build -o ../../dist/assinatura-macos-amd64 ./cmd/assinatura

      # T-05.1.4: Publicar artefatos do workflow
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-binaries
          path: dist/*
